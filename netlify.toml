# ============================================================
# CAMPUNI - campuni.achillesmedia.com.br
# ============================================================
# Site estático (Vite) + funções de servidor para o que não pode rodar
# no navegador: gravar contato e denúncia com a service_role do Supabase.
# O domínio fica no Cloudflare apontando para este site (ver DEPLOY.md).
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# As chamadas do app para /api/... vão para as funções.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Qualquer outra rota é do app (React Router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Frame-Options = "SAMEORIGIN"

# Arquivos com hash no nome nunca mudam: cache de um ano no CDN e no
# navegador. A segunda visita no 4G do campo abre sem baixar nada.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
